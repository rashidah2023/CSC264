<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HTML Form Coding Lab</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#667085;--bd:#d9dde7;--ac:#4f46e5;--ok:#16a34a;--er:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1c2030;--tx:#e8eaf2;--mu:#9aa3b8;--bd:#333a50;--ac:#818cf8}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1c2030;--tx:#e8eaf2;--mu:#9aa3b8;--bd:#333a50;--ac:#818cf8}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:1100px;margin:0 auto;padding:18px 14px 48px}
h1{font-size:1.45rem;margin:0}p.s{color:var(--mu);margin:2px 0 12px}
.pb{height:7px;background:var(--bd);border-radius:6px;overflow:hidden}.pb i{display:block;height:100%;width:0;background:var(--ok);transition:.3s}
.pl{font-size:.82rem;color:var(--mu);margin:5px 0 12px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.tabs button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 12px;border-radius:9px;cursor:pointer;font:inherit;font-size:.88rem}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}.tabs button.dn::after{content:" ✓";color:var(--ok)}.tabs button.on.dn::after{color:#fff}
.g{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:820px){.g{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.task{background:color-mix(in srgb,var(--ac) 10%,transparent);border-left:4px solid var(--ac);padding:9px 12px;border-radius:6px;font-size:.9rem;margin-bottom:10px}
textarea{width:100%;height:300px;resize:vertical;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);tab-size:2;white-space:pre}
textarea:focus{outline:2px solid var(--ac)}
.btn{background:var(--ac);color:#fff;border:0;padding:8px 14px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;margin:8px 6px 0 0}
.btn.o{background:transparent;color:var(--tx);border:1px solid var(--bd)}
iframe{width:100%;height:340px;border:1px solid var(--bd);border-radius:8px;background:#fff}
.ck{list-style:none;padding:0;margin:0}.ck li{padding:3px 0;color:var(--mu);font-size:.88rem}.ck li.d{color:var(--ok)}.ck li.f{color:var(--er)}
.ck li::before{content:"○ "}.ck li.d::before{content:"✓ "}.ck li.f::before{content:"✗ "}
.msg{margin-top:10px;padding:9px 11px;border-radius:8px;font-size:.9rem;background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.hint{margin-top:10px;padding:9px 11px;border-radius:8px;font-size:.88rem;background:color-mix(in srgb,#d97706 14%,transparent)}
h2{font-size:1rem;margin:0 0 8px}code{background:var(--bg);padding:1px 5px;border-radius:4px}
</style></head><body><div class="w">
<h1>💻 HTML Form Coding Lab</h1>
<p class="s">Write the HTML yourself. The preview updates as you type, and the checker tells you what is still missing.</p>
<div class="pb"><i id="pb"></i></div><div class="pl" id="pt"></div>
<div class="tabs" id="tabs"></div>
<div class="g">
 <div><div class="card"><div class="task" id="task"></div>
  <textarea id="ed" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
  <button class="btn" id="chk">✔ Check my code</button><button class="btn o" id="hb">💡 Hint</button><button class="btn o" id="sb">🔒 Solution</button><button class="btn o" id="rb">↺ Reset</button>
  <div id="hx"></div><div id="sx"></div></div></div>
 <div><div class="card"><h2>Live preview</h2><iframe id="pv" sandbox="" title="Preview"></iframe></div>
  <div class="card"><h2>Requirements</h2><ul class="ck" id="ck"></ul><div id="mx"></div></div></div>
</div></div>
<script>
const $=id=>document.getElementById(id),A=(d,s)=>[...d.querySelectorAll(s)];
const attr=(e,a)=>(e&&e.getAttribute(a)||'').toLowerCase();
const labelled=d=>{const f=A(d,'input:not([type=submit]):not([type=hidden]):not([type=button]),select,textarea');return f.length>0&&f.every(e=>(e.id&&d.querySelector(`label[for="${e.id}"]`))||e.closest('label'))};
const radios=(d,n)=>{const g={};A(d,'input[type=radio]').forEach(r=>{if(r.name)g[r.name]=(g[r.name]||0)+1});return Object.values(g).some(v=>v>=n)};
const submit=d=>!!d.querySelector('button:not([type=button]):not([type=reset]),input[type=submit]');
const form=d=>d.querySelector('form');
const C=[
{n:'Login',task:'<b>Login form.</b> Build a login form for a system: email + password, both required, with linked labels and a submit button. It must send data using the <b>POST</b> method.',
 start:'<form>\n  <!-- 1. add method="post" to <form>   -->\n  <!-- 2. email input (type="email")      -->\n  <!-- 3. password input (type="password") -->\n  <!-- 4. labels with for="" + matching id -->\n  <!-- 5. a submit button                  -->\n</form>',
 hint:'A label connects to an input with <label for="x"> and <input id="x">. Add the <code>required</code> attribute to make a field mandatory.',
 sol:'<form method="post" action="/login">\n  <label for="em">Email</label>\n  <input type="email" id="em" name="email" required>\n  <label for="pw">Password</label>\n  <input type="password" id="pw" name="password" required>\n  <button type="submit">Log in</button>\n</form>',
 k:[['<form> uses method="post"',d=>attr(form(d),'method')=='post'],['Email input with type="email" and required',d=>!!d.querySelector('input[type=email][required]')],['Password input with type="password" and required',d=>!!d.querySelector('input[type=password][required]')],['Every field has a linked <label>',labelled],['Has a submit button',submit]]},
{n:'Registration',task:'<b>Registration form.</b> Collect name, email, role and gender, and require acceptance of the terms. Group the gender options in a <code>&lt;fieldset&gt;</code> with a <code>&lt;legend&gt;</code>.',
 start:'<form action="/register" method="post">\n  <!-- name: text, required                  -->\n  <!-- email: type="email"                    -->\n  <!-- role: <select> with 3+ options          -->\n  <!-- gender: 2+ radios, same name, fieldset  -->\n  <!-- terms: checkbox, required              -->\n  <!-- submit button                           -->\n</form>',
 hint:'Radio buttons in the same group must share the same <code>name</code>. Options go inside <code>&lt;select&gt;</code> as <code>&lt;option&gt;</code> tags.',
 sol:'<form action="/register" method="post">\n  <label for="n">Full name</label>\n  <input type="text" id="n" name="name" required>\n  <label for="e">Email</label>\n  <input type="email" id="e" name="email" required>\n  <label for="r">Role</label>\n  <select id="r" name="role">\n    <option>Student</option>\n    <option>Teacher</option>\n    <option>Admin</option>\n  </select>\n  <fieldset>\n    <legend>Gender</legend>\n    <label><input type="radio" name="g" value="m"> Male</label>\n    <label><input type="radio" name="g" value="f"> Female</label>\n  </fieldset>\n  <label><input type="checkbox" name="terms" required> I accept the terms</label>\n  <button type="submit">Register</button>\n</form>',
 k:[['Has a <form> with an action attribute',d=>!!attr(form(d),'action')],['Required text input for the name',d=>!!d.querySelector('input[type=text][required]')],['Email input (type="email")',d=>!!d.querySelector('input[type=email]')],['<select> with at least 3 options',d=>!!d.querySelector('select')&&A(d,'select option').length>=3],['2+ radios sharing a name, inside <fieldset> + <legend>',d=>radios(d,2)&&!!d.querySelector('fieldset legend')],['Required checkbox',d=>!!d.querySelector('input[type=checkbox][required]')],['Every field is labelled',labelled],['Has a submit button',submit]]},
{n:'Feedback',task:'<b>Feedback form.</b> Let users choose a satisfaction level (3+ radios), give a rating with a slider (1–5) and write a comment limited to 200 characters.',
 start:'<form method="post" action="/feedback">\n  <!-- satisfaction: 3+ radios in a fieldset/legend -->\n  <!-- rating: <input type="range"> with min + max   -->\n  <!-- comment: <textarea> with rows + maxlength     -->\n  <!-- submit button                                  -->\n</form>',
 hint:'Slider: <code>&lt;input type="range" min="1" max="5"&gt;</code>. Textarea: <code>&lt;textarea rows="4" maxlength="200"&gt;&lt;/textarea&gt;</code>.',
 sol:'<form method="post" action="/feedback">\n  <fieldset>\n    <legend>Satisfaction</legend>\n    <label><input type="radio" name="s" value="1"> Poor</label>\n    <label><input type="radio" name="s" value="2"> OK</label>\n    <label><input type="radio" name="s" value="3"> Great</label>\n  </fieldset>\n  <label for="rt">Rating (1-5)</label>\n  <input type="range" id="rt" name="rating" min="1" max="5">\n  <label for="c">Comments</label>\n  <textarea id="c" name="comment" rows="4" maxlength="200"></textarea>\n  <button type="submit">Send feedback</button>\n</form>',
 k:[['3+ radios sharing a name',d=>radios(d,3)],['Radios grouped in <fieldset> with <legend>',d=>!!d.querySelector('fieldset legend')],['Range slider with min and max',d=>!!d.querySelector('input[type=range][min][max]')],['<textarea> with rows and maxlength',d=>!!d.querySelector('textarea[rows][maxlength]')],['Every field is labelled',labelled],['Submit button has visible text',d=>{const b=d.querySelector('button,input[type=submit]');return !!b&&((b.textContent||b.value||'').trim().length>0)}]]},
{n:'Search',task:'<b>Search/filter form.</b> A product search sent with the <b>GET</b> method so the filters appear in the URL: keyword, category, max price and two checkboxes.',
 start:'<form>\n  <!-- method="get" + action="/search"       -->\n  <!-- keyword: type="search" + placeholder   -->\n  <!-- category: <select> with 3+ options     -->\n  <!-- max price: type="number" min + max     -->\n  <!-- 2 checkboxes (e.g. In stock, On sale)   -->\n  <!-- submit button                           -->\n</form>',
 hint:'GET is used for searches because the data goes in the URL and can be bookmarked. Use <code>type="search"</code> for the keyword input.',
 sol:'<form method="get" action="/search">\n  <label for="q">Keyword</label>\n  <input type="search" id="q" name="q" placeholder="Search products...">\n  <label for="c">Category</label>\n  <select id="c" name="cat">\n    <option>All</option>\n    <option>Books</option>\n    <option>Gadgets</option>\n  </select>\n  <label for="p">Max price</label>\n  <input type="number" id="p" name="price" min="0" max="1000">\n  <label><input type="checkbox" name="stock"> In stock</label>\n  <label><input type="checkbox" name="sale"> On sale</label>\n  <button type="submit">Search</button>\n</form>',
 k:[['<form> uses method="get"',d=>attr(form(d),'method')=='get'],['Search input with a placeholder',d=>!!d.querySelector('input[type=search][placeholder]')],['<select> with at least 3 options',d=>A(d,'select option').length>=3],['Number input with min and max',d=>!!d.querySelector('input[type=number][min][max]')],['At least 2 checkboxes',d=>A(d,'input[type=checkbox]').length>=2],['Every field is labelled',labelled],['Has a submit button',submit]]},
{n:'Booking',task:'<b>Booking form.</b> Use specialised input types: date (not in the past), time, guests (1–10), phone (10–11 digits) and a required service dropdown.',
 start:'<form method="post" action="/book">\n  <!-- date: type="date" + min="2026-01-01" + required -->\n  <!-- time: type="time"                              -->\n  <!-- guests: type="number" min="1" max="10"          -->\n  <!-- phone: type="tel" + pattern="[0-9]{10,11}"      -->\n  <!-- service: <select required>                      -->\n  <!-- submit button                                   -->\n</form>',
 hint:'<code>pattern</code> holds a regular expression: <code>[0-9]{10,11}</code> means 10 to 11 digits. A placeholder option with <code>value=""</code> makes a required select work.',
 sol:'<form method="post" action="/book">\n  <label for="d">Date</label>\n  <input type="date" id="d" name="date" min="2026-01-01" required>\n  <label for="t">Time</label>\n  <input type="time" id="t" name="time">\n  <label for="g">Guests</label>\n  <input type="number" id="g" name="guests" min="1" max="10">\n  <label for="ph">Phone</label>\n  <input type="tel" id="ph" name="phone" pattern="[0-9]{10,11}">\n  <label for="s">Service</label>\n  <select id="s" name="service" required>\n    <option value="">-- choose --</option>\n    <option>Haircut</option>\n    <option>Massage</option>\n  </select>\n  <button type="submit">Book now</button>\n</form>',
 k:[['Date input with min and required',d=>!!d.querySelector('input[type=date][min][required]')],['Time input',d=>!!d.querySelector('input[type=time]')],['Number input with min="1" and max="10"',d=>{const i=d.querySelector('input[type=number]');return !!i&&attr(i,'min')=='1'&&attr(i,'max')=='10'}],['Phone input (type="tel") with a pattern',d=>!!d.querySelector('input[type=tel][pattern]')],['Required <select>',d=>!!d.querySelector('select[required]')],['Every field is labelled',labelled],['Has a submit button',submit]]},
{n:'Upload',task:'<b>Profile/upload form.</b> Files need a special encoding. Add a photo upload, website URL, a country field with suggestions (<code>&lt;datalist&gt;</code>) and a bio.',
 start:'<form method="post" action="/profile">\n  <!-- enctype="multipart/form-data" on <form>   -->\n  <!-- photo: type="file" + accept="image/*"     -->\n  <!-- website: type="url" + placeholder         -->\n  <!-- country: text input with list="..."       -->\n  <!--   + <datalist> with 3+ options             -->\n  <!-- bio: <textarea>                            -->\n  <!-- submit button                              -->\n</form>',
 hint:'The input\'s <code>list="cl"</code> must match <code>&lt;datalist id="cl"&gt;</code>. File uploads require <code>enctype="multipart/form-data"</code> with method POST.',
 sol:'<form method="post" action="/profile" enctype="multipart/form-data">\n  <label for="f">Photo</label>\n  <input type="file" id="f" name="photo" accept="image/*">\n  <label for="u">Website</label>\n  <input type="url" id="u" name="site" placeholder="https://">\n  <label for="co">Country</label>\n  <input type="text" id="co" name="country" list="cl">\n  <datalist id="cl">\n    <option value="Malaysia">\n    <option value="Singapore">\n    <option value="Indonesia">\n  </datalist>\n  <label for="b">Bio</label>\n  <textarea id="b" name="bio"></textarea>\n  <button type="submit">Save profile</button>\n</form>',
 k:[['<form> has enctype="multipart/form-data"',d=>attr(form(d),'enctype')=='multipart/form-data'],['File input with accept',d=>!!d.querySelector('input[type=file][accept]')],['URL input (type="url")',d=>!!d.querySelector('input[type=url]')],['Input linked by list= to a <datalist> with 3+ options',d=>{const i=d.querySelector('input[list]');if(!i)return false;const l=d.getElementById(i.getAttribute('list'));return !!l&&l.querySelectorAll('option').length>=3}],['A <textarea>',d=>!!d.querySelector('textarea')],['Every field is labelled',labelled],['Has a submit button',submit]]}
];
let cur=0,done=new Set(),att=C.map(()=>0),used=C.map(()=>false),code=C.map(c=>c.start);
const tabs=$('tabs');
C.forEach((c,i)=>{const b=document.createElement('button');b.textContent=(i+1)+'. '+c.n;b.onclick=()=>go(i);tabs.appendChild(b)});
function prog(){$('pb').style.width=done.size/C.length*100+'%';$('pt').textContent=done.size+' / '+C.length+' challenges complete'+(done.size==C.length?' 🎉 Great job!':'')}
function lock(){const ok=att[cur]>=2||done.has(cur);$('sb').textContent=ok?'👀 Solution':'🔒 Solution ('+(2-att[cur])+' more tries)'}
function go(i){cur=i;lock();[...tabs.children].forEach((b,j)=>b.classList.toggle('on',i==j));$('task').innerHTML=C[i].task;$('ed').value=code[i];$('hx').innerHTML='';$('sx').innerHTML='';$('mx').innerHTML='';render();doc(null)}
function render(){$('pv').srcdoc='<style>body{font:15px system-ui,sans-serif;padding:12px;color:#222;background:#fff}label{display:block;margin-top:8px}fieldset label{display:inline-block;margin-right:10px}input,select,textarea{padding:5px;max-width:100%}button{margin-top:12px;padding:6px 14px}fieldset{margin-top:8px}</style>'+$('ed').value}
function doc(res){$('ck').innerHTML=C[cur].k.map((k,i)=>`<li class="${res?(res[i]?'d':'f'):''}">${k[0].replace(/</g,'&lt;')}</li>`).join('')}
let tm;$('ed').oninput=()=>{code[cur]=$('ed').value;clearTimeout(tm);tm=setTimeout(render,250)};
$('ed').onkeydown=e=>{if(e.key=='Tab'){e.preventDefault();const t=e.target,s=t.selectionStart;t.value=t.value.slice(0,s)+'  '+t.value.slice(t.selectionEnd);t.selectionStart=t.selectionEnd=s+2;t.oninput()}};
$('chk').onclick=()=>{
 if($('ed').value.trim()===C[cur].start.trim()){$('mx').innerHTML='<div class="hint">✏️ Write some code first, then press Check.</div>';return}
 att[cur]++;const d=new DOMParser().parseFromString($('ed').value,'text/html');
 const res=C[cur].k.map(k=>{try{return !!k[1](d)}catch(e){return false}});doc(res);
 if(res.every(Boolean)){
  if(used[cur])$('mx').innerHTML='<div class="hint">You copied the model solution, so this one is not credited. Press ↺ Reset and write it yourself to earn the ✓.</div>';
  else{done.add(cur);tabs.children[cur].classList.add('dn');prog();$('mx').innerHTML='<div class="msg">✅ All requirements met! '+(cur<C.length-1?'Move on to the next challenge.':'')+'</div>'}
 }else $('mx').innerHTML='<div class="hint">'+res.filter(x=>!x).length+' requirement(s) still missing – check the ✗ items.'+(att[cur]<2?' Solution unlocks after '+(2-att[cur])+' more attempt(s).':' 👀 The solution is now unlocked if you need it.')+'</div>';
 lock()};
$('hb').onclick=()=>$('hx').innerHTML='<div class="hint">💡 '+C[cur].hint+'</div>';
$('sb').onclick=()=>{if(!(att[cur]>=2||done.has(cur))){$('sx').innerHTML='<div class="hint">🔒 Try it yourself first! Edit your code and press <b>Check my code</b> '+(2-att[cur])+' more time(s) to unlock the solution. Use the 💡 Hint if you are stuck.</div>';return}const e=x=>x.replace(/&/g,'&amp;').replace(/</g,'&lt;');
 $('sx').innerHTML='<div class="hint"><b>👀 Model solution</b> – study it, then compare with your own code.<pre style="white-space:pre-wrap;margin:8px 0;font:12.5px/1.45 ui-monospace,Menlo,Consolas,monospace;overflow-x:auto">'+e(C[cur].sol)+'</pre><button class="btn" id="us" style="margin-top:0">⬆ Use this solution in the editor</button> <button class="btn o" id="hs" style="margin-top:0">Hide</button></div>';
 $('us').onclick=()=>{used[cur]=true;code[cur]=C[cur].sol;$('ed').value=code[cur];render();$('sx').innerHTML='';$('chk').click()};
 $('hs').onclick=()=>$('sx').innerHTML=''};
$('rb').onclick=()=>{used[cur]=false;code[cur]=C[cur].start;$('ed').value=code[cur];render();doc(null);$('mx').innerHTML=''};
prog();go(0);
</script></body></html>
